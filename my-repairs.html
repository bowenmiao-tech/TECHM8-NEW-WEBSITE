<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Repair History | TECHM8</title>
  <meta name="description" content="View all TECHM8 repair bookings linked to your customer account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="promo-banner">
    <div class="container promo-banner__inner">
      <span>Signed-in customers can review previous repair requests and their latest status here.</span>
      <a href="account.html">Back to account</a>
    </div>
  </div>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="TECHM8 home">
        <img class="brand__logo" src="assets/logo-techm8.png" alt="TECHM8 logo">
      </a>
      <input class="nav__mobile-input" type="checkbox" id="primary-menu-toggle">
      <label class="nav__toggle" for="primary-menu-toggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </label>
      <nav class="nav__menu" id="primary-menu">
        <a href="index.html">Home</a>
        <a href="repairs.html">Repairs</a>
        <a href="products.html">Products</a>
        <a href="stores.html">Stores</a>
        <a href="store-policy.html">Store Policy</a>
        <a class="nav__cart-link" href="cart.html">Cart <span class="nav__cart-count" data-cart-count>0</span></a>
        <a class="nav__shop-link" href="shop.html">Online Store</a>
      </nav>
    </div>
  </header>

  <main class="storefront-page" data-my-repairs-page>
    <section class="section">
      <div class="container history-layout">
        <div class="section-heading section-heading--split">
          <div>
            <p class="eyebrow">My account</p>
            <h1>My repair history</h1>
          </div>
          <a href="account.html">Back to account</a>
        </div>

        <div class="booking-message" data-repairs-history-message hidden></div>
        <div data-repairs-history-list></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer footer--bottom">
      <p>&copy; 2026 TECHM8. All rights reserved.</p>
      <a href="store-policy.html">Repair Terms & Conditions</a>
    </div>
  </footer>

  <script src="site-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
