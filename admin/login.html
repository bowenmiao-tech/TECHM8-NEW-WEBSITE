<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHM8 Admin Login</title>
  <meta name="description" content="Secure back-office access for TECHM8 staff.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-body">
  <main class="admin-login" data-admin-login-page>
    <a class="admin-login__brand" href="../index.html" aria-label="TECHM8 home">
      <img src="../assets/logo-techm8.png" alt="TECHM8 logo">
    </a>
    <section class="admin-login__card">
      <p class="eyebrow">TECHM8 Admin</p>
      <h1>Back-office sign in</h1>
      <p class="admin-login__copy">Use your approved staff account. Access is granted from the admin whitelist in Supabase.</p>
      <div class="admin-alert" data-admin-auth-message hidden></div>
      <form class="admin-login__form" data-admin-login-form novalidate>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" placeholder="name@example.com.au" required>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
        </label>
        <button class="button button--primary" type="submit">Sign in to admin</button>
      </form>
      <div class="admin-login__links">
        <a href="../account.html">Customer account</a>
        <a href="../forgot-password.html">Forgot password</a>
      </div>
    </section>
  </main>

  <script type="module" src="../site-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
