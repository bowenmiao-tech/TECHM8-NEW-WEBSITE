name: Refresh catalog pages

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-updated]

permissions:
  contents: write

concurrency:
  group: refresh-catalog-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate product and business pages
        run: npm run prerender

      - name: Validate AUD pricing across pages and Merchant Center feed
        run: npm run validate:pricing

      - name: Publish changed generated pages
        shell: bash
        run: |
          if git diff --quiet -- products product-page sitemap.xml sitemap-pages.xml sitemap-products.xml public/product-page public/sitemap.xml public/sitemap-pages.xml public/sitemap-products.xml merchant-products.xml public/merchant-products.xml llms.txt public/llms.txt business-services.html business-services repair-services; then
            echo "Catalog pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products product-page sitemap.xml sitemap-pages.xml sitemap-products.xml public/product-page public/sitemap.xml public/sitemap-pages.xml public/sitemap-products.xml merchant-products.xml public/merchant-products.xml llms.txt public/llms.txt business-services.html business-services repair-services
          git commit -m "chore: refresh generated catalog pages [skip ci]"
          git push
