<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7YLMGHMRDG"></script>
<script defer src="/ga4.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHM8 Product</title>
  <meta name="description" content="TECHM8 product detail page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="promo-banner">
    <div class="container promo-banner__inner">
      <span>TECHM8 product detail page powered by the live catalog.</span>
      <a href="shop.html">Back to online store</a>
    </div>
  </div>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html" aria-label="TECHM8 home">
        <img class="brand__logo" src="assets/logo-techm8.png" alt="TECHM8 logo">
      </a>
      <input class="nav__mobile-input" type="checkbox" id="primary-menu-toggle">
      <label class="nav__toggle" for="primary-menu-toggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </label>
      <nav class="nav__menu" id="primary-menu">
        <a href="index.html">Home</a>
        <a href="repairs.html">Repairs</a>
        <a href="products.html">Products</a>
        <a href="stores.html">Stores</a>
        <a href="store-policy.html">Store Policy</a>
        <a class="nav__cart-link" href="cart.html">Cart <span class="nav__cart-count" data-cart-count>0</span></a>
        <a class="nav__shop-link" href="shop.html">Online Store</a>
      </nav>
    </div>
  </header>

  <main class="storefront-page storefront-page--detail" data-product-page>
    <section class="section">
      <div class="container" data-product-shell>
        <article class="storefront-card storefront-card--loading">
          <div class="storefront-card__body">
            <span class="storefront-card__pill">Loading</span>
            <h3>Loading product...</h3>
            <p>Please wait while the page checks the live catalog.</p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer footer--bottom">
      <p>&copy; 2026 TECHM8. All rights reserved.</p>
      <a href="store-policy.html">Repair Terms & Conditions</a>
    </div>
  </footer>

  <script type="module" src="site-config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
