
[functions.catalog-refresh-hook]
enabled = true
verify_jwt = true
import_map = "./functions/catalog-refresh-hook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/catalog-refresh-hook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/catalog-refresh-hook/*.html" ]

[functions.zip-payment-return]
enabled = true
verify_jwt = false
entrypoint = "./functions/zip-payment-return/index.ts"

[functions.paypal-payment-return]
enabled = true
verify_jwt = false
entrypoint = "./functions/paypal-payment-return/index.ts"

[functions.paypal-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/paypal-webhook/index.ts"

[functions.payment-methods]
enabled = true
verify_jwt = false
entrypoint = "./functions/payment-methods/index.ts"
